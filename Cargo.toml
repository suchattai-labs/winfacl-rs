[package]
name = "winfacl"
version = "0.10.0"
edition = "2021"
description = "Two-panel POSIX ACL manager in the style of Windows Advanced Security Settings / SetACL Studio"
license = "MIT"
repository = "https://github.com/suchattai-labs/winfacl-rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustix = { version = "0.38", features = ["fs"] }
uzers = "0.12"
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
